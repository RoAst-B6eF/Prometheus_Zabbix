global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance_name: CauseYou

  - job_name: alertmanager
    static_configs:
      - targets: ['localhost:9093']
        labels:
          instance_name: CauseYou

  - job_name: node
    static_configs:
      - targets: ['10.10.10.11:9100']
        labels:
          instance_name: CauseYou
      - targets: ['10.10.10.12:9100']
        labels:
          instance_name: StepSon
